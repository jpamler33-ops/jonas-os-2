name: BIGGJ Project Status

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read

concurrency:
  group: biggj-project-status
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Test status renderer
        run: node --test .github/scripts/biggj-project-status.test.cjs

      - name: Refresh canonical BIGGJ status issue
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('node:path');
            const { buildProjectStatus } = require(
              path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/biggj-project-status.cjs')
            );

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;

            const branch = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: defaultBranch
            });

            const mainSha = branch.data.commit.sha;
            const mainCommit = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: mainSha
            });

            const openPrs = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'open',
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              }
            );

            const closedPrs = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'closed',
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              }
            );
            const recentMergedPrs = closedPrs
              .filter((pr) => Boolean(pr.merged_at))
              .slice(0, 10);

            const workflowRuns = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch: defaultBranch,
              per_page: 20
            });
            const recentRuns = (workflowRuns.data.workflow_runs || []).slice(0, 10);

            const body = buildProjectStatus({
              repository: repository.data.full_name,
              defaultBranch,
              mainSha,
              mainTitle: String(mainCommit.data.commit?.message || '').split('\n')[0],
              updatedAt: new Date().toISOString(),
              openPrs,
              recentMergedPrs,
              recentRuns
            });

            const marker = '<!-- BIGGJ_PROJECT_STATUS_V1 -->';
            const title = '[BIGGJ] Project Status';
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'all',
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              }
            );

            const existing = issues.find((issue) =>
              !issue.pull_request &&
              (issue.title === title || String(issue.body || '').includes(marker))
            );

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
                state: 'open'
              });
              core.info(`Updated BIGGJ project status issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
              core.info(`Created BIGGJ project status issue #${created.data.number}`);
            }
