name: BIGGJ Direction V2 Holdout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test stack
        run: node --test biggj/*.test.mjs
      - name: Run sealed V2 holdout
        run: node biggj/run-direction-v2-holdout.mjs
      - name: Verify artifact guards
        run: node -e "const r=require('./biggj-direction-v2-holdout.json');if(r.canExecuteLive!==false||r.mode!=='SHADOW_ONLY'||r.cutoff!=='2026-01-01T00:00:00Z'||!r.registrySha256)process.exit(1);console.log(r.results)"
      - uses: actions/upload-artifact@v4
        with:
          name: biggj-direction-v2-holdout-${{ github.run_id }}
          path: biggj-direction-v2-holdout.json
          retention-days: 90
