name: BIGGJ Sealed Holdout
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Dataset start UTC'
        required: true
        default: '2025-01-01T00:00:00Z'
      cutoff:
        description: 'Training/Holdout cutoff UTC'
        required: true
        default: '2026-01-01T00:00:00Z'
      end:
        description: 'Dataset end-exclusive UTC'
        required: true
        default: '2026-09-01T00:00:00Z'
permissions:
  contents: read
jobs:
  sealed-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test BIGGJ stack
        run: node --test biggj/*.test.mjs
      - name: Run sealed holdout
        env:
          BIGGJ_START: ${{ inputs.start }}
          BIGGJ_CUTOFF: ${{ inputs.cutoff }}
          BIGGJ_END: ${{ inputs.end }}
        run: node biggj/run-sealed-holdout.mjs
      - name: Verify research-only artifact
        run: node -e "const r=require('./biggj-sealed-holdout.json');if(r.canExecuteLive!==false||r.mode!=='SHADOW_ONLY'||r.purpose!=='RESEARCH_ONLY')process.exit(1);if(!r.dataset.sha256||!r.registry.sha256)process.exit(2);console.log('dataset',r.dataset.sha256,'registry',r.registry.sha256)"
      - uses: actions/upload-artifact@v4
        with:
          name: biggj-sealed-holdout-${{ github.run_id }}
          path: biggj-sealed-holdout.json
          retention-days: 90
