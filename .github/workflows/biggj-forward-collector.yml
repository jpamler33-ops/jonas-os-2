name: BIGGJ Forward Derivatives Collector
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: biggj-forward-derivatives
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hydrate rolling research stores
        run: |
          git fetch origin biggj-research-data
          git checkout origin/biggj-research-data --             biggj/data/forward-derivatives.json             biggj/data/derivatives-outcomes.json

      - name: Verify BIGGJ tests
        run: node --test biggj/*.test.mjs

      - name: Collect and evaluate forward derivatives
        run: node biggj/run-forward-collector.mjs

      - name: Upload immutable research snapshot
        uses: actions/upload-artifact@v4
        with:
          name: biggj-forward-derivatives-${{ github.run_id }}
          path: |
            biggj/data/forward-derivatives.json
            biggj/data/derivatives-outcomes.json
          retention-days: 30

      - name: Persist rolling stores outside production branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add biggj/data/forward-derivatives.json biggj/data/derivatives-outcomes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(biggj): append derivatives evidence and outcomes'
          git push --force-with-lease origin HEAD:refs/heads/biggj-research-data
