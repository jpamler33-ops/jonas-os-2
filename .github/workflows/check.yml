name: TCX Institutional Check

on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
    branches:
      - main
      - 'integration/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Unit and integration tests
        run: npm test
