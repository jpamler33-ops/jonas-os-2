name: TCX Institutional Check

on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
    branches:
      - main
      - 'integration/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Unit and integration tests
        run: npm test
      - name: Docker packaging smoke test
        run: |
          docker build --tag tcx-institutional-ci .
          docker run --rm --entrypoint node tcx-institutional-ci --input-type=module -e "import { access } from 'node:fs/promises'; import { institutionalRuntimeFiles } from './runtime-release-registry.mjs'; const missing=[]; for (const f of institutionalRuntimeFiles()) { try { await access('/app/'+f); } catch { missing.push(f); } } if (missing.length) { console.error('Missing runtime files in image:', missing); process.exit(1); } console.log('Runtime packaging closure OK:', institutionalRuntimeFiles().length);"

