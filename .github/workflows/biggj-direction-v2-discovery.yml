name: BIGGJ Direction V2 Discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test BIGGJ stack
        run: node --test biggj/*.test.mjs
      - name: Run pre-holdout discovery
        run: node biggj/run-direction-v2-discovery.mjs
      - name: Verify no 2026 data
        run: node -e "const r=require('./biggj-direction-v2-discovery.json');if(r.period.endExclusive!=='2026-01-01T00:00:00.000Z'||r.canExecuteLive!==false)process.exit(1);console.log('sealed pre-holdout discovery',r.datasetSha256)"
      - uses: actions/upload-artifact@v4
        with:
          name: biggj-direction-v2-discovery-${{ github.run_id }}
          path: biggj-direction-v2-discovery.json
          retention-days: 90
