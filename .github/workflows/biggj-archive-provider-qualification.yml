name: BIGGJ Archive Provider Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe archive providers
        run: node biggj/run-archive-provider-qualification.mjs
      - name: Verify research guards
        run: node -e "const r=require('./biggj-archive-provider-qualification.json');if(r.canExecuteLive!==false||r.mode!=='SHADOW_ONLY')process.exit(1);console.log(r.results)"
      - uses: actions/upload-artifact@v4
        with:
          name: biggj-archive-provider-qualification-${{ github.run_id }}
          path: biggj-archive-provider-qualification.json
          retention-days: 90
