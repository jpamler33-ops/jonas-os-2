name: BIGGJ Tardis Coverage Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe historical access
        run: node biggj/tardis-coverage-probe.mjs
      - name: Verify safety
        run: node -e "const r=require('./biggj-tardis-coverage-probe.json');if(r.canExecuteLive!==false||r.mode!=='SHADOW_ONLY')process.exit(1);console.log(r.decision,r.results)"
      - uses: actions/upload-artifact@v4
        with:
          name: biggj-tardis-coverage-probe-${{ github.run_id }}
          path: biggj-tardis-coverage-probe.json
          retention-days: 30
