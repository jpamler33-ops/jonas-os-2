name: BIGGJ Free Derivatives Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe free BTCUSDT funding + OI history
        run: |
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import {fetchPowakaBTC,auditPowaka} from './biggj/powakadata-sample.mjs';
          const rows=await fetchPowakaBTC();
          const audit=auditPowaka(rows,{start:Date.parse('2025-01-01T00:00:00Z'),end:Date.parse('2026-01-01T00:00:00Z')});
          const report={generatedAt:new Date().toISOString(),purpose:'RESEARCH_ONLY',mode:'SHADOW_ONLY',canExecuteLive:false,source:'powakadata-free-sample',audit,usable2025:audit.count>=1000&&audit.fundingCoverage>=.95&&audit.oiCoverage>=.95};
          await writeFile('biggj-free-derivatives-probe.json',JSON.stringify(report,null,2));console.log(report);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: biggj-free-derivatives-probe-${{ github.run_id }}
          path: biggj-free-derivatives-probe.json
          retention-days: 90
