name: W6 120s tests one-shot patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[w6-120s-tests-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Migrate W6 strict 120s contract
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path('shadow-specialist-wallets.mjs')
          s=code.read_text()
          s=s.replace("else if(ageSeconds>Math.max(1,Number(maxAgeSeconds)||120))blockers.push('OLDER_THAN_MAX_AGE');", "else if(ageSeconds>=Math.max(1,Number(maxAgeSeconds)||120))blockers.push('OLDER_THAN_MAX_AGE');")
          s=s.replace("const ageWithin=ageKnown&&signal.ageSeconds<=signal.maxAgeSeconds;", "const ageWithin=ageKnown&&signal.ageSeconds<signal.maxAgeSeconds;")
          code.write_text(s)

          p=Path('shadow-specialist-wallets.test.mjs')
          s=p.read_text()
          replacements=[
            ("test('user 99k/60s V1 matches only coins already above 99k within 60 seconds'", "test('user 99k/120s V1 matches only coins already above 99k before 120 seconds'"),
            ("pairCreatedAt:now-61_000", "pairCreatedAt:now-120_000"),
            ("'AGE_LTE_60S_AND_MARKET_CAP_GTE_99K_IMMEDIATE'", "'AGE_LT_120S_AND_MARKET_CAP_GTE_99K_IMMEDIATE'"),
            ("tokenAddress:'OLD',symbol:'OLD',priceUsd:1,marketCap:150_000,pairCreatedAt:now-70_000", "tokenAddress:'OLD',symbol:'OLD',priceUsd:1,marketCap:150_000,pairCreatedAt:now-120_000"),
            ("'GMGN_TRENDS_1M_AND_AGE_LTE_60S_AND_GREEN_PERCENT_GTE_99K_THEN_IMMEDIATE_ENTRY'", "'GMGN_TRENDS_1M_AND_AGE_LT_120S_AND_GREEN_PERCENT_GTE_99K_THEN_IMMEDIATE_ENTRY'")
          ]
          for old,new in replacements:
              s=s.replace(old,new)
          anchor="  const old=evaluateUser99k60sEntry({\n    priceUsd:.001,marketCap:150_000,pairCreatedAt:now-120_000\n  },{now});"
          if "pairCreatedAt:now-119_999" not in s:
              near="  const nearBoundary=evaluateUser99k60sEntry({\n    priceUsd:.001,marketCap:150_000,pairCreatedAt:now-119_999\n  },{now});\n  assert.equal(nearBoundary.match,true);\n  assert.equal(nearBoundary.action,'BUY_SHADOW');\n\n"
              if anchor not in s:
                  raise SystemExit('boundary anchor missing')
              s=s.replace(anchor,near+anchor,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Validate migrated W6 tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          node --test shadow-specialist-wallets.test.mjs 2>&1 | tee w6-test-output.tap
      - name: Upload W6 test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w6-test-diagnostics
          path: w6-test-output.tap
          if-no-files-found: warn
          retention-days: 1
      - name: Fail if validation failed
        if: steps.tests.outcome != 'success'
        run: exit 1
      - name: Commit validated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shadow-specialist-wallets.mjs shadow-specialist-wallets.test.mjs
          if git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git commit -m 'fix(w6): strict <120s entry with aligned funnel diagnostics [w6-120s-tests-applied]'
          git push origin HEAD:main
