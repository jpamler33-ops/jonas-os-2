name: W6 120s tests one-shot patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[w6-120s-tests-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply strict W6 120s boundary and migrate tests
        run: |
          python - <<'PY'
          from pathlib import Path

          code=Path('shadow-specialist-wallets.mjs')
          s=code.read_text()
          old="else if(ageSeconds>Math.max(1,Number(maxAgeSeconds)||120))blockers.push('OLDER_THAN_MAX_AGE');"
          new="else if(ageSeconds>=Math.max(1,Number(maxAgeSeconds)||120))blockers.push('OLDER_THAN_MAX_AGE');"
          assert s.count(old)==1, f'production boundary expected once, got {s.count(old)}'
          code.write_text(s.replace(old,new))

          p=Path('shadow-specialist-wallets.test.mjs')
          s=p.read_text()
          replacements={
            "test('user 99k/60s V1 matches only coins already above 99k within 60 seconds'":"test('user 99k/120s V1 matches only coins already above 99k before 120 seconds'",
            "pairCreatedAt:now-61_000":"pairCreatedAt:now-120_000",
            "'AGE_LTE_60S_AND_MARKET_CAP_GTE_99K_IMMEDIATE'":"'AGE_LT_120S_AND_MARKET_CAP_GTE_99K_IMMEDIATE'",
            "tokenAddress:'OLD',symbol:'OLD',priceUsd:1,marketCap:150_000,pairCreatedAt:now-70_000":"tokenAddress:'OLD',symbol:'OLD',priceUsd:1,marketCap:150_000,pairCreatedAt:now-120_000",
            "'GMGN_TRENDS_1M_AND_AGE_LTE_60S_AND_GREEN_PERCENT_GTE_99K_THEN_IMMEDIATE_ENTRY'":"'GMGN_TRENDS_1M_AND_AGE_LT_120S_AND_GREEN_PERCENT_GTE_99K_THEN_IMMEDIATE_ENTRY'"
          }
          for old,new in replacements.items():
            assert s.count(old)==1, f'{old}: expected once, got {s.count(old)}'
            s=s.replace(old,new)
          anchor="  const old=evaluateUser99k60sEntry({\n    priceUsd:.001,marketCap:150_000,pairCreatedAt:now-120_000\n  },{now});"
          near="  const nearBoundary=evaluateUser99k60sEntry({\n    priceUsd:.001,marketCap:150_000,pairCreatedAt:now-119_999\n  },{now});\n  assert.equal(nearBoundary.match,true);\n  assert.equal(nearBoundary.action,'BUY_SHADOW');\n\n"
          assert s.count(anchor)==1, f'boundary anchor expected once, got {s.count(anchor)}'
          s=s.replace(anchor,near+anchor)
          p.write_text(s)
          PY
          git diff --check
          node --test shadow-specialist-wallets.test.mjs
      - name: Commit validated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shadow-specialist-wallets.mjs shadow-specialist-wallets.test.mjs
          git commit -m 'fix(w6): strict <120s entry with migrated tests [w6-120s-tests-applied]'
          git push origin HEAD:main
