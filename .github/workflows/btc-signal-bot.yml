name: BTC Signal Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"

permissions:
  contents: read

concurrency:
  group: btc-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Engine Selbsttest
        run: python bot.py --self-test

      - name: BTC Regeln pruefen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BIGGJ_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Status speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-status
          path: latest_status.json
          if-no-files-found: ignore
          retention-days: 3
