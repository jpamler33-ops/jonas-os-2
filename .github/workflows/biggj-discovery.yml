name: BIGGJ Discovery Benchmark
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Historical candles per interval'
        required: false
        default: '1000'
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test BIGGJ research stack
        run: node --test biggj/*.test.mjs
      - name: Run real BTC signal discovery
        env:
          BIGGJ_LIMIT: ${{ inputs.limit }}
        run: node biggj/run-discovery-benchmark.mjs > biggj-discovery.json
      - name: Enforce research-only safety
        run: node -e "const r=require('./biggj-discovery.json');if(r.canExecuteLive!==false||r.mode!=='SHADOW_ONLY'||r.purpose!=='RESEARCH_ONLY')process.exit(1);console.log('discovery sets:',r.results.length)"
      - uses: actions/upload-artifact@v4
        with:
          name: biggj-discovery-${{ github.run_id }}
          path: biggj-discovery.json
          retention-days: 30
