name: BIGGJ Derivatives Coverage Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test BIGGJ stack
        run: node --test biggj/*.test.mjs
      - name: Audit 2025 derivatives coverage
        run: node biggj/run-derivatives-coverage-audit.mjs
      - name: Verify research-only artifact
        run: node -e "const r=require('./biggj-derivatives-coverage-audit.json');if(r.canExecuteLive!==false||r.mode!=='SHADOW_ONLY')process.exit(1);console.log(r.sources,r.decision)"
      - uses: actions/upload-artifact@v4
        with:
          name: biggj-derivatives-coverage-${{ github.run_id }}
          path: biggj-derivatives-coverage-audit.json
          retention-days: 90
